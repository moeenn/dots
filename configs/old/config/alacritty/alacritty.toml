[window]
dimensions = { columns = 120, lines = 24 }
padding = { x = 10, y = 10 }

[font]
size = 9.5
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Regular" }

[font.offset]
x = 0
y = 8

[font.glyph_offset]
x = 0
y = 4

[cursor]
style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true

[colors.primary]
background = "#f9f5d7"
foreground = "#654735"

[colors.cursor]
text   = "#f9f5d7"
cursor = "#654735"

[colors.selection]
text       = "CellForeground"
background = "#f2e5bc"

[colors.normal]
black   = "#654735"
red     = "#c14a4a"
green   = "#6c782e"
yellow  = "#b47109"
blue    = "#45707a"
magenta = "#945e80"
cyan    = "#4c7a5d"
white   = "#f2e5bc"

[colors.bright]
black   = "#928374"
red     = "#c14a4a"
green   = "#6c782e"
yellow  = "#b47109"
blue    = "#45707a"
magenta = "#945e80"
cyan    = "#4c7a5d"
white   = "#f2e5bc"
