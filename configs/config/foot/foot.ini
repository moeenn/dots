font=JetBrains Mono:size=10
# font-bold=<bold variant of regular font>
# font-italic=<italic variant of regular font>
# font-bold-italic=<bold+italic variant of regular font>
# font-size-adjustment=0.5
line-height=20
# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# underline-thickness=<font underline thickness>
# box-drawings-uses-font-glyphs=no
# dpi-aware=no

# initial-window-size-pixels=700x500  # Or,
initial-window-size-chars=120x24
# initial-window-mode=windowed
pad=10x10             
# resize-delay-ms=100

[scrollback]
lines=2000
# multiplier=3.0

[cursor]
style=block
blink=no

[colors]
foreground=ffffff
background=1e1e1e

# Normal/regular colors (0-7)
regular0=241f31
regular1=c01c28
regular2=26a269
regular3=a2734c
regular4=1c71d8
regular5=813d9c
regular6=2aa198
regular7=deddda

# Bright colors (8-15)
bright0=77767b
bright1=ed333b
bright2=33d17a
bright3=e66100
bright4=3584e4
bright5=c061cb
bright6=4adade
bright7=ffffff

