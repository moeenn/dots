font=JetBrains Mono:size=10
# font-bold=<bold variant of regular font>
# font-italic=<italic variant of regular font>
# font-bold-italic=<bold+italic variant of regular font>
# font-size-adjustment=0.5
line-height=20
# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# underline-thickness=<font underline thickness>
# box-drawings-uses-font-glyphs=no
# dpi-aware=no

# initial-window-size-pixels=700x500  # Or,
initial-window-size-chars=120x24
# initial-window-mode=windowed
pad=10x10             
# resize-delay-ms=100

[scrollback]
lines=2000
# multiplier=3.0

[cursor]
style=block
blink=no

[colors]
background=fdf6e3
foreground=657b83

## Normal/regular colors (color palette 0-7)
regular0=eee8d5 # black
regular1=dc322f # red
regular2=859900 # green
regular3=b58900 # yellow
regular4=268bd2 # blue
regular5=d33682 # magenta
regular6=2aa198 # cyan
regular7=073642 # white

## Bright colors (color palette 8-15)
bright0=cb4b16 # bright black
bright1=fdf6e3 # bright red
bright2=93a1a1 # bright green
bright3=839496 # bright yellow
bright4=657b83 # bright blue
bright5=6c71c4 # bright magenta
bright6=586e75 # bright cyan
bright7=002b36 # bright white


