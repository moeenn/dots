[[language]]
name = "python"
auto-format = true
formatter = { command = "bash", args = ["-c", "ruff check --fix - | ruff format -"] }
language-servers = [
    {name = "pyright"},
    {name = "ruff"}
]

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "cpp"
auto-format = true
file-types = ["cpp", "hpp", "c", "h", "cc"]
indent = { tab-width = 4, unit = "    " }
formatter = { command = "clang-format", args = ["--style=Webkit"]}

[[language]]
name = "javascript"
indent = { tab-width = 4, unit = "    " }
auto-format = true
formatter = { command = "npx", args = ["prettier", "--parser", "typescript"]}

[[language]]
name = "typescript"
auto-format = true
indent = { tab-width = 4, unit = "    " }
formatter = { command = "npx", args = ["prettier", "--parser", "typescript"]}

[[language]]
name = "elixir"
auto-format = true
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "ocaml"
auto-format = true
indent = { tab-width = 4, unit = "    " }
formatter = { command = "ocamlformat", args = [
  "-",
  "--impl",
  "--enable-outside-detected-project",
] }

[[language]]
name = "nim"
scope = "source.nim"
file-types = ["nim","nims"]
comment-token = "#"
indent = { tab-width = 4, unit = " " }
formatter = { command = "nph", args = ["-"] }
auto-format = true
